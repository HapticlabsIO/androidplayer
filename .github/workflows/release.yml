name: Release

# Publishes to Maven Central, then tags and creates a GitHub release, whenever a
# new gradle.properties version lands on main. Mirrors
# HapticlabsIO/workflows' release-on-version-change.yml, which this public repo
# can't call because that repo is private.

on:
  push:
    branches: [main]
    paths: [gradle.properties]

permissions:
  contents: read

jobs:
  release:
    name: Publish and release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # Serialise runs so two pushes in quick succession can't race for the same version.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Determine whether the version is already released
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Value of the last version property, as in version=1.2.3
          version=$(sed -nE 's/^\s*version\s*[=:]\s*(\S+).*$/\1/p' gradle.properties | tail -n1)

          if [ -z "$version" ]; then
            echo "No version found in gradle.properties" >&2
            exit 1
          fi

          tag="v${version}"

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "${tag} already exists - nothing to release"
            released=false
          else
            echo "${tag} is new - publishing and releasing"
            released=true
          fi

          {
            echo "released=$released"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Set up build
        if: steps.version.outputs.released == 'true'
        uses: ./.github/actions/setup-build
        with:
          app-id: ${{ secrets.SUBMODULE_AUTH_BOI_APP_ID }}
          app-private-key: ${{ secrets.SUBMODULE_AUTH_BOI_APP_KEY }}

      - name: Publish to Maven Central
        if: steps.version.outputs.released == 'true'
        env:
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./gradlew publish jreleaserDeploy

      - name: Create tag and release
        if: steps.version.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
