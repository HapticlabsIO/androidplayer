# Published coordinates: io.hapticlabs:hapticlabsplayer:<version>.
# Bumping the version on main tags a release and publishes it to Maven Central.
group=io.hapticlabs
version=0.7.1

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Like React Native, opt out of AGP 9's built-in Kotlin and new DSL until AGP 10 removes the opt-outs
android.builtInKotlin=false
android.newDsl=false
